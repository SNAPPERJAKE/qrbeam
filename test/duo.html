<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QR Beam duo test</title>
<style>
  body { margin: 0; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; background: #1b2128; color: #dfe6ee; font: 13px/1.4 ui-monospace, Consolas, monospace; }
  iframe { border: 0; background: #fff; }
  #log { flex-basis: 100%; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- Two copies of QR Beam facing each other. Each one's "camera" is a canvas
     that repaints what the other one's screen shows, a little tilted and
     blurred, so the whole two-way loop runs without hardware.
     Serve the qrbeam folder over http, open test/duo.html, then in the console:
       await duo.run({ size: 60000 })            two-way, one code
       await duo.run({ size: 60000, lanes: 2 })  two-way, two codes
       await duo.run({ size: 60000, twoWay: false })                        -->
<iframe id="tx" src="../index.html" width="820" height="560" title="sender"></iframe>
<iframe id="rx" src="../index.html" width="560" height="760" title="receiver"></iframe>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
const log = (...a) => { $('log').textContent += a.join(' ') + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Resolves once the frame holds a fresh, started copy of the app.
async function loaded(f) {
  for (let i = 0; i < 200; i++) {
    const w = f.contentWindow;
    if (w && w.QRBeam && !w.__stale && f.contentDocument.readyState === 'complete') return;
    await sleep(50);
  }
  throw new Error('app did not load in ' + f.id);
}

// A canvas "camera" that keeps copying one element of the other device's screen.
function fakeCamera(getSource, { angle, blur, size, glitch }) {
  const cam = document.createElement('canvas');
  cam.width = 1280; cam.height = 720;
  const c = cam.getContext('2d');
  const paint = () => {
    c.filter = 'none';
    c.fillStyle = '#4a5260';
    c.fillRect(0, 0, 1280, 720);
    const src = getSource();
    if (!src || !src.width || src.offsetParent === null) return;
    const k = Math.min(size.w / src.width, size.h / src.height);
    const w = src.width * k, h = src.height * k;
    c.save();
    c.translate(640, 360);
    c.rotate((angle * Math.PI) / 180);
    c.filter = `blur(${Math.random() < glitch ? 3 : blur}px) brightness(0.88) contrast(0.92)`;
    c.drawImage(src, -w / 2, -h / 2, w, h);
    c.restore();
  };
  const timer = setInterval(paint, 33);
  return { stream: cam.captureStream(30), stop: () => clearInterval(timer) };
}

// Hidden browser panes throttle frame callbacks; give the copies a steady clock.
function steadyClock(win) {
  win.requestAnimationFrame = (cb) => win.setTimeout(() => cb(win.performance.now()), 16);
  win.cancelAnimationFrame = (id) => win.clearTimeout(id);
  win.HTMLVideoElement.prototype.requestVideoFrameCallback = function (cb) {
    return win.setTimeout(() => cb(win.performance.now(), {}), 33);
  };
}

window.duo = {
  async run({ size = 60000, lanes = 1, twoWay = true, glitch = 0.1, timeout = 180000 } = {}) {
    const tx = $('tx'), rx = $('rx');
    // Both copies share this origin's storage, so one settings object serves both.
    localStorage.setItem('qrbeam', JSON.stringify({ fpsIdx: 3, twoWay, lanes, density: 'normal', sound: false, rxFacing: 'environment' }));
    for (const f of [tx, rx]) if (f.contentWindow) f.contentWindow.__stale = true;
    tx.src = '../index.html?tx' + Date.now();
    rx.src = '../index.html?rx' + Date.now();
    await sleep(100);
    await Promise.all([loaded(tx), loaded(rx)]);
    await sleep(300);
    const T2 = tx.contentWindow, R2 = rx.contentWindow, TD2 = tx.contentDocument, RD2 = rx.contentDocument;
    steadyClock(T2); steadyClock(R2);

    // what each camera sees
    const toRx = fakeCamera(() => TD2.getElementById('qr'), { angle: 2, blur: 0.5, size: { w: 1200, h: 600 }, glitch });
    const toTx = fakeCamera(() => RD2.getElementById('status-qr'), { angle: -3, blur: 0.4, size: { w: 260, h: 260 }, glitch: 0 });
    T2.navigator.mediaDevices.getUserMedia = async () => toTx.stream;
    R2.navigator.mediaDevices.getUserMedia = async () => toRx.stream;

    // the file to send
    const data = new Uint8Array(size);
    for (let i = 0; i < size; i += 65536) crypto.getRandomValues(data.subarray(i, Math.min(size, i + 65536)));
    TD2.getElementById('go-send').click();
    const dt = new T2.DataTransfer();
    dt.items.add(new T2.File([data], 'duo.bin', { type: 'application/octet-stream' }));
    const fi = TD2.getElementById('file-input');
    fi.files = dt.files;
    fi.dispatchEvent(new T2.Event('change'));
    RD2.getElementById('go-receive').click();
    await sleep(500);
    TD2.getElementById('send-start').click();

    const t0 = performance.now();
    const speeds = [];
    let lastSpeed = '';
    let gotAt = 0, deliveredAt = 0;
    while (performance.now() - t0 < timeout) {
      await sleep(250);
      const sv = TD2.getElementById('speed-val').textContent;
      if (sv !== lastSpeed) { speeds.push(((performance.now() - t0) / 1000).toFixed(1) + 's ' + sv); lastSpeed = sv; }
      if (!gotAt && RD2.querySelector('#got a[download]')) gotAt = performance.now();
      if (!deliveredAt && !TD2.getElementById('delivered').hidden) deliveredAt = performance.now();
      if (gotAt && (deliveredAt || !twoWay)) break;
    }
    toRx.stop(); toTx.stop();
    let ok = false;
    const a = RD2.querySelector('#got a[download]');
    if (a) {
      const got = new Uint8Array(await (await R2.fetch(a.href)).arrayBuffer());
      ok = got.length === data.length && got.every((v, i) => v === data[i]);
    }
    const res = {
      ok,
      receivedAfter: gotAt ? +((gotAt - t0) / 1000).toFixed(1) : null,
      senderSawDoneAfter: deliveredAt ? +((deliveredAt - t0) / 1000).toFixed(1) : null,
      speeds,
      lanes: T2.QRBeam.sender ? T2.QRBeam.sender.lanes : '(stopped)',
      link: TD2.getElementById('link-line').textContent,
      delivered: TD2.getElementById('delivered-sum').textContent,
      rxSummary: RD2.getElementById('got-summary').textContent,
    };
    log(JSON.stringify(res));
    return res;
  },
};
</script>
</body>
</html>
